# Same shape as the old hand-written zsh prompt, plus git state and timings.
# Colours are the terminal's own ANSI colours, so they follow the Neon palette.
# No Nerd Font glyphs: none are installed.

add_newline = false

format = """
┌─\\[$username@$hostname:$directory\\]$git_branch$git_status$python$cmd_duration
└─$character"""

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold yellow"
format = "[$hostname]($style)"

[directory]
style = "bold red"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 0
truncate_to_repo = false
read_only = " ro"

[git_branch]
symbol = ""
style = "bold cyan"
format = " [$branch]($style)"

[git_status]
style = "bold yellow"
format = "([ $all_status$ahead_behind]($style))"

[python]
symbol = ""
style = "purple"
format = " [py $version( \\($virtualenv\\))]($style)"

[cmd_duration]
min_time = 2000
style = "white"
format = " [$duration]($style)"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold cyan)"
